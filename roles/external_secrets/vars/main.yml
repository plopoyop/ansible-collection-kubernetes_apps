---
external_secrets_helm_repo_name: "external-secrets"
external_secrets_helm_repo_url: "https://charts.external-secrets.io"
external_secrets_helm_chart_ref: "{{ external_secrets_helm_repo_name }}/external-secrets"
external_secrets_crd_helm_ownership:
  metadata:
    labels:
      app.kubernetes.io/managed-by: "Helm"
    annotations:
      meta.helm.sh/release-name: "{{ external_secrets_deployment_name }}"
      meta.helm.sh/release-namespace: "{{ external_secrets_namespace }}"
external_secrets_server_side_apply:
  field_manager: "ansible-external-secrets"
  force_conflicts: true
