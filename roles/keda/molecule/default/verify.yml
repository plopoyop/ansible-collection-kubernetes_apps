---
- name: Verify
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: "Wait for 'keda' namespace to be active."
      kubernetes.core.k8s_info:
        kind: "Namespace"
        name: "keda"
      register: namespace_keda
      until:
        - namespace_keda.resources | length > 0
        - namespace_keda.resources[0].status.phase == "Active"
      retries: 30
      delay: 5

    - name: "Assert that 'keda' namespace is active."
      ansible.builtin.assert:
        that:
          - namespace_keda.resources | length > 0
          - namespace_keda.resources[0].status.phase == "Active"
        fail_msg: "Namespace 'keda' is not active."

    - name: "Wait for 'keda-operator' Deployment to be available."
      kubernetes.core.k8s_info:
        kind: "Deployment"
        name: "keda-operator"
        namespace: "keda"
      register: keda_operator_deployment
      until: keda_operator_deployment.resources[0].status.availableReplicas | default(0) == 1
      retries: 60
      delay: 5

    - name: "Assert that 'keda-operator' Deployment is available."
      ansible.builtin.assert:
        that: keda_operator_deployment.resources[0].status.availableReplicas | default(0) == 1
        fail_msg: "Deployment 'keda-operator' is not available."

    - name: "Wait for 'keda-operator-metrics-apiserver' Deployment to be available."
      kubernetes.core.k8s_info:
        kind: "Deployment"
        name: "keda-operator-metrics-apiserver"
        namespace: "keda"
      register: keda_metrics_deployment
      until: keda_metrics_deployment.resources[0].status.availableReplicas | default(0) == 1
      retries: 60
      delay: 5

    - name: "Assert that 'keda-operator-metrics-apiserver' Deployment is available."
      ansible.builtin.assert:
        that: keda_metrics_deployment.resources[0].status.availableReplicas | default(0) == 1
        fail_msg: "Deployment 'keda-operator-metrics-apiserver' is not available."

    - name: "Wait for 'keda-admission-webhooks' Deployment to be available."
      kubernetes.core.k8s_info:
        kind: "Deployment"
        name: "keda-admission-webhooks"
        namespace: "keda"
      register: keda_webhooks_deployment
      until: keda_webhooks_deployment.resources[0].status.availableReplicas | default(0) == 1
      retries: 60
      delay: 5

    - name: "Assert that 'keda-admission-webhooks' Deployment is available."
      ansible.builtin.assert:
        that: keda_webhooks_deployment.resources[0].status.availableReplicas | default(0) == 1
        fail_msg: "Deployment 'keda-admission-webhooks' is not available."

    - name: "Get the KEDA CRDs."
      kubernetes.core.k8s_info:
        api_version: "apiextensions.k8s.io/v1"
        kind: "CustomResourceDefinition"
        name: "{{ item }}"
      register: keda_crds
      loop:
        - "scaledobjects.keda.sh"
        - "scaledjobs.keda.sh"
        - "triggerauthentications.keda.sh"
        - "clustertriggerauthentications.keda.sh"

    - name: "Assert that the KEDA CRDs are installed."
      ansible.builtin.assert:
        that: item.resources | length > 0
        fail_msg: "CRD '{{ item.item }}' is not installed."
      loop: "{{ keda_crds.results }}"
      loop_control:
        label: "{{ item.item }}"
