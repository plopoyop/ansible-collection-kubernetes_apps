---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    keda_helm_chart_version: "2.20.0"
    keda_wait_install: false
  tasks:
    - name: Build a kind cluster (wait for control plane).
      ansible.builtin.command: >-
        kind create cluster
        --wait 300s
        --name molecule-test
        --kubeconfig {{ kubeconfig }}
        --image kindest/node:v1.32.3
      changed_when: true

    - name: "Install a previous KEDA release"
      ansible.builtin.import_role:
        name: "keda"
