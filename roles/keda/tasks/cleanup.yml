---
- name: "Uninstall KEDA helm package"
  kubernetes.core.helm:
    name: "{{ keda_deployment_name }}"
    namespace: "{{ keda_namespace }}"
    state: "absent"
    chart_ref: "{{ keda_helm_chart_ref }}"
    chart_version: "{{ keda_helm_chart_version }}"
    update_repo_cache: true
    wait: true
  tags:
    - "helm_chart"

- name: "Remove KEDA helm repo"
  kubernetes.core.helm_repository:
    name: "{{ keda_helm_repo_name }}"
    repo_url: "{{ keda_helm_repo_url }}"
    state: "absent"
  tags:
    - "helm_repository"

- name: "Remove KEDA namespace"
  kubernetes.core.k8s:
    name: "{{ keda_namespace }}"
    api_version: "v1"
    kind: "Namespace"
    state: "absent"
  tags:
    - "namespace"
