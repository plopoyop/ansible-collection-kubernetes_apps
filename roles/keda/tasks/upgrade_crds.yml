---
- name: "Render KEDA chart with CRDs"
  kubernetes.core.helm_template:
    chart_ref: "{{ keda_helm_chart_ref }}"
    chart_version: "{{ keda_helm_chart_version }}"
    release_name: "{{ keda_deployment_name }}"
    release_namespace: "{{ keda_namespace }}"
    include_crds: true
    update_repo_cache: true
  register: "keda_chart_render"
  check_mode: false
  changed_when: false

- name: "Apply KEDA CRDs (server-side, force conflicts)"
  kubernetes.core.k8s:
    state: "present"
    apply: true
    server_side_apply:
      field_manager: "ansible-keda-crds"
      force_conflicts: true
    definition: "{{ item }}"
  loop: >-
    {{ (keda_chart_render.stdout | default(''))
       | ansible.builtin.from_yaml_all
       | select
       | selectattr('kind', 'equalto', 'CustomResourceDefinition')
       | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  when: "keda_chart_render is not skipped"
