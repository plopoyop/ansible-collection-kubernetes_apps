---
- name: "Verify"
  hosts: "localhost"
  connection: "local"
  gather_facts: true

  tasks:
    - name: "Wait for 'kargo' namespace to be active."
      kubernetes.core.k8s_info:
        kind: "Namespace"
        name: "kargo"
      register: "namespace_kargo"
      until:
        - namespace_kargo.resources | length > 0
        - namespace_kargo.resources[0].status.phase == "Active"
      retries: 30
      delay: 5

    - name: "Assert that 'kargo' namespace is active."
      ansible.builtin.assert:
        that:
          - namespace_kargo.resources | length > 0
          - namespace_kargo.resources[0].status.phase == "Active"
        fail_msg: "Namespace 'kargo' is not active."

    - name: "Wait for 'kargo-api' Deployment to be ready."
      kubernetes.core.k8s_info:
        kind: "Deployment"
        name: "kargo-api"
        namespace: "kargo"
      register: "kargo_api_deployment"
      until:
        - kargo_api_deployment.resources | length > 0
        - kargo_api_deployment.resources[0].status.readyReplicas | default(0) >= 1
      retries: 60
      delay: 5

    - name: "Assert that 'kargo-api' Deployment is ready."
      ansible.builtin.assert:
        that:
          - kargo_api_deployment.resources | length > 0
          - kargo_api_deployment.resources[0].status.readyReplicas | default(0) >= 1
        fail_msg: "Deployment 'kargo-api' is not ready."

    - name: "Wait for 'kargo-controller' Deployment to be ready."
      kubernetes.core.k8s_info:
        kind: "Deployment"
        name: "kargo-controller"
        namespace: "kargo"
      register: "kargo_controller_deployment"
      until:
        - kargo_controller_deployment.resources | length > 0
        - kargo_controller_deployment.resources[0].status.readyReplicas | default(0) >= 1
      retries: 60
      delay: 5

    - name: "Assert that 'kargo-controller' Deployment is ready."
      ansible.builtin.assert:
        that:
          - kargo_controller_deployment.resources | length > 0
          - kargo_controller_deployment.resources[0].status.readyReplicas | default(0) >= 1
        fail_msg: "Deployment 'kargo-controller' is not ready."

    - name: "Get Kargo custom resources."
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version | default('kargo.akuity.io/v1alpha1') }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default(omit) }}"
      register: "kargo_resources"
      loop:
        - {kind: "ClusterPromotionTask", name: "molecule-cluster-task"}
        - {kind: "Project", name: "molecule-project"}
        - {kind: "ProjectConfig", name: "molecule-project", namespace: "molecule-project"}
        - {kind: "PromotionTask", name: "molecule-task", namespace: "molecule-project"}
        - {kind: "Warehouse", name: "molecule-warehouse", namespace: "molecule-project"}
        - {kind: "Stage", name: "test", namespace: "molecule-project"}
        - {api_version: "v1", kind: "Secret", name: "molecule-git-creds", namespace: "molecule-project"}
        - {api_version: "v1", kind: "Secret", name: "molecule-shared-image-creds", namespace: "kargo-shared-resources"}
        - {api_version: "v1", kind: "Secret", name: "molecule-generic-creds", namespace: "molecule-project"}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"

    - name: "Assert that Kargo custom resources exist."
      ansible.builtin.assert:
        that: item.resources | length == 1
        fail_msg: "{{ item.item.kind }} '{{ item.item.name }}' is missing."
      loop: "{{ kargo_resources.results }}"
      loop_control:
        label: "{{ item.item.kind }}/{{ item.item.name }}"

    - name: "Assert that credentials carry the Kargo cred-type label."
      ansible.builtin.assert:
        that:
          - kargo_resources.results[6].resources[0].metadata.labels['kargo.akuity.io/cred-type'] == "git"
          - kargo_resources.results[7].resources[0].metadata.labels['kargo.akuity.io/cred-type'] == "image"
          - kargo_resources.results[8].resources[0].metadata.labels['kargo.akuity.io/cred-type'] == "generic"
          - "'repoURL' not in kargo_resources.results[8].resources[0].data"
        fail_msg: "Credentials Secrets are not labelled for Kargo."
